services:
  mysql-db:
    image: mysql:latest
    container_name: mysql-gs
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: genre_service
    ports:
      - "3308:3306"
    networks:
      - shared-network
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql" ]
      timeout: 5s
      retries: 5
      interval: 10s

  genre-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genre-service-app
    ports:
      - "8081:8081"
    networks:
      - shared-network
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/genre_service?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql
      - spring.datasource.hikari.connection-timeout=45000
      - spring.datasource.hikari.initialization-fail-timeout=45000
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8181/realms/spring-microservices-security-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/spring-microservices-security-realm/protocol/openid-connect/certs

networks:
  shared-network:
    external: true
    name: library-app-network