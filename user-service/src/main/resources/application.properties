spring.application.name=user-service

server.port=8083

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3309/user_service
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.security.admin-emails=admin_admin@mail.com,admin@company.com,superuser@company.com,ceo@company.com

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://identity-provider:8181/realms/spring-microservices-security-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity-provider:8181/realms/spring-microservices-security-realm/protocol/openid-connect/certs

keycloak.url=http://identity-provider:8181
keycloak.realm=spring-microservices-security-realm
keycloak.client-id=library-frontend

logging.level.org.springframework.security=DEBUG